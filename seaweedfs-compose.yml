services:
  master:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "9333:9333"
      - "19333:19333"
      - "9324:9324"
    command: "master -ip=master -ip.bind=0.0.0.0 -metricsPort=9324 -mdir=/data"
    volumes:
      - seaweedfs_master_data:/data

  volume:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "18080:18080"
      - "9325:9325"
    command: 'volume -ip=volume -master="master:9333" -ip.bind=0.0.0.0 -port=8080 -metricsPort=9325 -dir=/data'
    volumes:
      - seaweedfs_volume_data:/data
    depends_on:
      - master

  filer:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "18888:18888"
      - "9326:9326"
    command: 'filer -ip=filer -master="master:9333" -ip.bind=0.0.0.0 -metricsPort=9326'
    volumes:
      - seaweedfs_filer_data:/data
    tty: true
    stdin_open: true
    depends_on:
      - master
      - volume

  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "8333:8333"
      - "9327:9327"
    command: 's3 -filer="filer:8888" -ip.bind=0.0.0.0 -metricsPort=9327'
    depends_on:
      - master
      - volume
      - filer

  webdav:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "7333:7333"
    command: 'webdav -filer="filer:8888"'
    depends_on:
      - master
      - volume
      - filer

  prometheus:
    image: prom/prometheus:v2.21.0
    restart: unless-stopped
    ports:
      - "9000:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus:/etc/prometheus
    command: '--web.enable-lifecycle --config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - s3

volumes:
  seaweedfs_master_data:
  seaweedfs_volume_data:
  seaweedfs_filer_data:
