global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'seaweedfs-master'
    static_configs:
      - targets: ['master:9324']

  - job_name: 'seaweedfs-volume'
    static_configs:
      - targets: ['volume:9325']

  - job_name: 'seaweedfs-filer'
    static_configs:
      - targets: ['filer:9326']

  - job_name: 'seaweedfs-s3'
    static_configs:
      - targets: ['s3:9327']

  - job_name: 'nestjs-backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:5000']

  - job_name: 'nextjs-frontend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']
